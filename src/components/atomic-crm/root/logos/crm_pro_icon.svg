<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">CRM Pro</title>
  <desc id="desc">Símbolo do CRM Pro com pessoas, crescimento e conexão.</desc>
  <defs>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1597ff"/>
      <stop offset=".55" stop-color="#075dcc"/>
      <stop offset="1" stop-color="#082052"/>
    </linearGradient>
    <linearGradient id="teal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#11e29a"/>
      <stop offset=".55" stop-color="#08bfa0"/>
      <stop offset="1" stop-color="#08727e"/>
    </linearGradient>
    <linearGradient id="orbit" x1="70" y1="390" x2="470" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#082052"/>
      <stop offset=".43" stop-color="#0a7fe7"/>
      <stop offset="1" stop-color="#10df82"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#061a45" flood-opacity=".18"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <circle cx="151" cy="221" r="33" fill="url(#teal)"/>
    <rect x="118" y="255" width="66" height="104" rx="30" fill="url(#teal)"/>

    <circle cx="258" cy="164" r="41" fill="url(#blue)"/>
    <rect x="218" y="208" width="80" height="160" rx="34" fill="url(#blue)"/>

    <circle cx="365" cy="108" r="49" fill="url(#blue)"/>
    <rect x="317" y="160" width="96" height="214" rx="42" fill="url(#blue)"/>

    <path d="M79 331C135 402 260 424 363 383C428 357 470 312 478 250C484 201 467 160 430 139"
      fill="none" stroke="url(#orbit)" stroke-width="31" stroke-linecap="round"/>
    <path d="M82 333C150 382 253 396 344 367"
      fill="none" stroke="#0b52b7" stroke-width="18" stroke-linecap="round" opacity=".9"/>
  </g>
</svg>