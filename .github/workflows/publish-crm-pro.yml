name: 🌐 Publicar CRM Pro

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: crm-pro-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build CRM Pro
        env:
          VITE_IS_DEMO: "false"
          VITE_SUPABASE_URL: "https://pulsssmguyfhnfsfukgm.supabase.co"
          VITE_SB_PUBLISHABLE_KEY: "sb_publishable_pgU8Kym0OHyURQPE-TIvrA_UvmRa2-B"
          VITE_ATTACHMENTS_BUCKET: "attachments"
          VITE_INBOUND_EMAIL: ""
        run: npm run build

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
